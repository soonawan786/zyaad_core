name: zyaad_core
description: >-
  Shared Zyaad Islamic-feature code: prayer-time models, the local-notification
  schedule planner and channel, Qibla bearing, the tilt-compensated compass
  heading, the motion gate, the driver prayer-break timer, and the shared
  screens (next-prayer card, Qibla, settings, prayer-stop prompt).

  The domain logic is plain Dart so it can be unit-tested without a device; the
  Flutter layer is here so the rider app and the driver app use one
  implementation of everything rather than two that drift apart.
version: 1.0.5

# Not published to pub.dev: consumed as a git dependency (or a path dependency
# during local development). Remove this line if you ever want `dart pub
# publish` to work.
publish_to: 'none'

homepage: https://github.com/soonawan786/zyaad_core
repository: https://github.com/soonawan786/zyaad_core
issue_tracker: https://github.com/soonawan786/zyaad_core/issues

topics:
  - flutter
  - prayer-times
  - qibla
  - notifications

environment:
  sdk: '>=3.3.4 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State management, matching the host apps.
  get: ^4.7.3

  # Local notifications + the timezone database used to convert a prayer's
  # absolute instant into the city's zone for zonedSchedule().
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0

  # Magnetometer + accelerometer for the compass. See README.md for why the
  # heading fusion is ours rather than a compass plugin's.
  sensors_plus: ^7.1.1

  # Device-only preferences (azan sound) and the cached prayer window.
  shared_preferences: ^2.5.5

  # Opens the OS battery-optimisation screen from the settings guide.
  app_settings: ^7.0.0

  # NOTE: share_plus is deliberately NOT a dependency here.
  #
  # It resolves objective_c transitively, whose build hook needs a working Xcode
  # native-assets toolchain, which made `flutter test` in this package fail before
  # any test ran on a machine without one. The share sheet is therefore reached
  # through ShareCardSharer, implemented in the host apps — which already depend on
  # share_plus. See INTEGRATION.md, "Wiring the share sheet".

# The Naskh face for the share card's Arabic.
#
# NOT DECLARED YET, deliberately: `flutter` fails a build when a declared font
# asset is missing, and the .ttf cannot be committed here. Until it is added the
# card falls back to the platform's Arabic face, which still shapes correctly.
#
# To enable (see assets/font/README.md):
#   1. download NotoNaskhArabic-Regular.ttf and -Bold.ttf into assets/font/
#   2. uncomment the block below
#
fonts:
  - family: NotoNaskhArabic
    fonts:
      - asset: assets/font/NotoNaskhArabic-Regular.ttf
        weight: 400
      - asset: assets/font/NotoNaskhArabic-Bold.ttf
        weight: 700

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
