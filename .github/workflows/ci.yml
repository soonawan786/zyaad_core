name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pin the SDK so a Flutter upgrade cannot silently change what CI
          # verifies. The apps are on 3.44.9; bump this deliberately.
          flutter-version: '3.44.9'
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --reporter expanded
